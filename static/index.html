<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Recomendador de productos con Granite 3.2.">
    <title>AI E-Commerce Product Recommender</title>
    <!-- Hoja de estilos extraída del bloque <style> original. -->
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <!-- Encabezado principal de la aplicación. -->
    <h1>AI E-Commerce Product Recommender</h1>

    <!-- Controles de entrada del usuario. -->
    <textarea id="preferences" placeholder="Indica tus preferencias de compra (por ejemplo, si buscas un portátil para juegos, equipamiento deportivo, etc.)..."></textarea><br>
    <button id="recommend-button">Obtener recomendaciones</button>

    <h2>Productos recomendados:</h2>
    <div id="response">Aquí aparecerán tus recomendaciones de productos generadas por IA...</div>

    <!-- Lógica del navegador (se carga después de parsear el HTML). -->
    <script src="/static/script.js" defer></script>

</body>
</html>
